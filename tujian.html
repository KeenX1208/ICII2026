<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; width: 100%; overflow: hidden; }
        .background {
            width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            background-color: #f0f0f0; overflow: hidden;
        }
        .image-wrapper { position: relative; max-width: 100%; max-height: 100%; }
        .image-wrapper > img {
            max-width: 100%; max-height: 100%;
            width: auto; height: auto;
            display: block; object-fit: contain;
        }
        .menpai {
            position: absolute;
            padding: 0.5em 1.2em;
            background-image: url('./images/牌子横屏.webp');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;
            color: #232121;
            font-size: 1.2vw;
            font-weight: bold;
            border-radius: 0.5em;
            letter-spacing: 1px;
            white-space: nowrap;
            z-index: 10;
            transform: translate(-50%, -50%);
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease, filter 0.3s ease;
        }
        .jingguan {
            position: absolute;
            height: 25%;
            z-index: 8;
            transform: translate(-50%, -100%);
            cursor: pointer;
            transition: transform 0.3s ease, filter 0.3s ease;
            filter: drop-shadow(0 0 0 transparent);
        }
        .jingguan img { height: 100%; width: auto; display: block; pointer-events: none; }
        .menpai.hovered {
            transform: translate(-50%, -50%) scale(1.15);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
            filter: brightness(1.1);
        }
        .jingguan.hovered {
            transform: translate(-50%, -100%) scale(1.15);
            filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.45)) brightness(1.1);
        }
        .jingguan-17,.jingguan-20{
            height: 10%;
        }
        .jingguan-18{
            height: 8%;
        }
        /* ===== 原有 1-16 ===== */
        .menpai-1  { top: 31%; left: 34%; }
        .menpai-2  { top: 42%; left: 60%; }
        .menpai-3  { top: 10%; left: 62%; }
        .menpai-4  { top: 20%; left: 70%; }
        .menpai-5  { top: 45%; left: 25%; }
        .menpai-6  { top: 16%; left: 50%; }
        .menpai-7  { top: 35%; left: 84%; }
        .menpai-8  { top: 63%; left: 10%; }
        .menpai-9  { top: 60%; left: 32%; }
        .menpai-10 { top: 65%; left: 55%; }
        .menpai-11 { top: 70%; left: 82%; }
        .menpai-12 { top: 83%; left: 18%; }
        .menpai-13 { top: 60%; left: 42%; }
        .menpai-14 { top: 87%; left: 62%; }
        .menpai-15 { top: 90%; left: 82%; }
        .menpai-16 { top: 95%; left: 45%; }

        .jingguan-1  { top: 26%; left: 34%; }
        .jingguan-2  { top: 46%; left: 55%; }
        .jingguan-3  { top: 35%; left: 62%; }
        .jingguan-4  { top: 35%; left: 70%; }
        .jingguan-5  { top: 40%; left: 25%; }
        .jingguan-6  { top: 38%; left: 50%; }
        .jingguan-7  { top: 30%; left: 84%; }
        .jingguan-8  { top: 58%; left: 10%; }
        .jingguan-9  { top: 62%; left: 32%; }
        .jingguan-10 { top: 60%; left: 55%; }
        .jingguan-11 { top: 65%; left: 82%; }
        .jingguan-12 { top: 78%; left: 18%; }
        .jingguan-13 { top: 80%; left: 42%; }
        .jingguan-14 { top: 82%; left: 62%; }
        .jingguan-15 { top: 85%; left: 82%; }
        .jingguan-16 { top: 96%; left: 45%; }

        /* ===== 新增 17-22（6 个补齐队伍）===== */
        .menpai-17 { top: 15%;  left: 20%; }
        .menpai-18 { top: 12%; left: 30%; }
        .menpai-19 { top: 40%; left: 5%;  }
        .menpai-20 { top: 50%; left: 92%; }
        .menpai-21 { top: 78%; left: 5%;  }
        .menpai-22 { top: 86%; left: 35%; }

        .jingguan-17 { top: 10%;  left: 20%; }
        .jingguan-18 { top: 9%;  left: 30%; }
        .jingguan-19 { top: 45%; left: 5%;  }
        .jingguan-20 { top: 45%; left: 92%; }
        .jingguan-21 { top: 73%; left: 5%;  }
        .jingguan-22 { top: 90%; left: 35%; }

        .zhuzi1, .zhuzi2 {
            position: absolute; height: 35%; z-index: 5;
            transform-origin: bottom center;
            animation: sway 3s ease-in-out infinite;
            pointer-events: none;
        }
        .zhuzi1 img, .zhuzi2 img { height: 100%; width: auto; display: block; }
        .zhuzi1 { top: 50%; left: 10%; }
        .zhuzi2 { top: 50%; left: 70%; animation-delay: 0.5s; }

        .yanzi {
            position: absolute; top: 20%; right: 0; height: 8%;
            z-index: 6; animation: fly 20s linear infinite; pointer-events: none;
        }
        .yanzi img { height: 100%; width: auto; display: block; }

        @keyframes sway {
            0%   { transform: translate(-50%, -50%) rotate(-5deg); }
            50%  { transform: translate(-50%, -50%) rotate(5deg); }
            100% { transform: translate(-50%, -50%) rotate(-5deg); }
        }
        @keyframes fly {
            0%   { right: -15%; top: 20%; transform: scale(0.9); }
            10%  { top: 1%; }
            20%  { top: 1%; transform: scale(1); }
            30%  { top: 10%; }
            40%  { top: 24%; transform: scale(0.95); }
            50%  { top: 1%; }
            60%  { top: 2%; transform: scale(1.05); }
            70%  { top: 2%; }
            80%  { top: 12%; transform: scale(0.9); }
            90%  { top: 16%; }
            100% { right: 100%; top: 16%; transform: scale(0.9); }
        }
    </style>
</head>
<body>

    <script>
        document.querySelectorAll('[data-href]').forEach(el => {
            el.addEventListener('click', () => {
                window.location.href = el.dataset.href;
            });
        });

        // 上限改为 22（16 + 6）
        for (let i = 1; i <= 22; i++) {
            const jg = document.querySelector('.jingguan-' + i);
            const mp = document.querySelector('.menpai-' + i);
            if (!jg || !mp) continue;

            const on  = () => { jg.classList.add('hovered'); mp.classList.add('hovered'); };
            const off = () => { jg.classList.remove('hovered'); mp.classList.remove('hovered'); };

            [jg, mp].forEach(el => {
                el.addEventListener('mouseenter', on);
                el.addEventListener('mouseleave', off);
            });
        }
    </script>
